name: First Benchmarked Experiment (T-dev-6L)

# Runs a complete training experiment end-to-end on a minimal synthetic corpus,
# generates checkpoint samples, scores them with the benchmark workflow, and
# uploads all artifacts. This demonstrates the full training→benchmark pipeline
# without requiring GPU or external data.

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Number of training steps"
        required: false
        default: "20"
      seed:
        description: "Random seed"
        required: false
        default: "42"

permissions:
  contents: read

jobs:
  train-and-benchmark:
    name: Train T-dev-6L and score checkpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Prepare training data and tokenizer
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path
          from supreme_modeltx.model_core.tokenizer.workflow import train_versioned_sentencepiece

          run_root = Path("artifacts/runs/t_dev_6l_first_run")
          data_dir = run_root / "data"
          data_dir.mkdir(parents=True, exist_ok=True)

          corpus = [
              "Sovereign AI enables distributed model training without cloud dependency.",
              "The supreme-modeltx repository provides a clean training loop for language models.",
              "Write a Python function max_of_two that returns the larger integer.",
              "List comprehensions in Python allow concise iteration over sequences.",
              "If five machines make five widgets in five minutes, the rate is one widget per machine.",
              "All birds have wings and most birds can fly using those wings.",
              "A sparrow is a bird and therefore has wings according to the syllogism.",
              "Gradient descent optimises model parameters by moving against the gradient direction.",
              "Checkpoint saving allows training to resume from the most recent saved state.",
              "Mixed precision training uses float16 or bfloat16 to reduce memory footprint.",
              "Tokenisation converts raw text into integer token sequences for model input.",
              "Benchmark evaluation measures model capability across code and reasoning tasks.",
              "Validation loss decreases as the model fits the training distribution better.",
              "Perplexity is the exponent of the cross-entropy loss and measures fluency.",
              "AdamW combines Adam optimisation with decoupled weight decay regularisation.",
              "The cosine learning rate schedule smoothly anneals the learning rate over training.",
              "Distributed training spreads computation across multiple GPUs or nodes.",
              "Data manifests describe the sources splits and paths used for training.",
              "SentencePiece produces a subword vocabulary suitable for multilingual models.",
              "Run artifacts capture provenance timestamps configs and sample outputs.",
          ]
          train_file = data_dir / "train.jsonl"
          val_file = data_dir / "val.jsonl"
          with train_file.open("w") as f:
              for s in corpus[:16]:
                  f.write(json.dumps({"text": s}) + "\n")
          with val_file.open("w") as f:
              for s in corpus[16:]:
                  f.write(json.dumps({"text": s}) + "\n")

          manifest_path = run_root / "manifest.yaml"
          manifest_path.write_text(
              f'version: "1"\ndescription: t-dev-6l first benchmark run\nsources:\n'
              f'  - name: train-corpus\n    backend: jsonl\n    path: {train_file.as_posix()}\n    split: train\n'
              f'  - name: val-corpus\n    backend: jsonl\n    path: {val_file.as_posix()}\n    split: validation\n',
              encoding="utf-8",
          )

          train_versioned_sentencepiece(
              manifest_path=str(manifest_path),
              artifact_root=Path("artifacts/tokenizers/t-dev-6l"),
              model_variant="t-dev-6l",
              version="v-first-run",
              vocab_size=512,
              character_coverage=1.0,
          )
          print("Data and tokenizer ready.")
          PYEOF

      - name: Run training experiment
        run: |
          python - <<'PYEOF'
          import json
          from supreme_modeltx.model_core.config.schema import SMTXConfig
          from supreme_modeltx.model_core.training.trainer import train

          tokenizer_path = "artifacts/tokenizers/t-dev-6l/t-dev-6l/v-first-run/tokenizer.model"
          manifest_path = "artifacts/runs/t_dev_6l_first_run/manifest.yaml"

          cfg = SMTXConfig.model_validate({
              "model": {
                  "model_variant": "t-dev-6l",
                  "vocab_size": 512,
                  "hidden_size": 256,
                  "num_hidden_layers": 6,
                  "num_attention_heads": 8,
                  "num_key_value_heads": 8,
                  "intermediate_size": 1024,
                  "max_position_embeddings": 128,
                  "torch_dtype": "float32",
                  "pad_token_id": 0,
                  "bos_token_id": 1,
                  "eos_token_id": 2,
              },
              "tokenizer": {"backend": "sentencepiece", "model_path": tokenizer_path},
              "data": {
                  "manifest_path": manifest_path,
                  "tokenizer_path": tokenizer_path,
                  "train_split": "train",
                  "validation_split": "validation",
                  "max_seq_len": 128,
                  "pack_sequences": True,
              },
              "training": {
                  "seed": ${{ github.event.inputs.seed || 42 }},
                  "max_steps": ${{ github.event.inputs.max_steps || 20 }},
                  "batch_size": 2,
                  "gradient_accumulation_steps": 1,
                  "log_every_n_steps": 5,
                  "eval_every_n_steps": 10,
                  "eval_max_batches": 4,
                  "precision": {"enabled": False, "dtype": "float32"},
                  "optimizer": {
                      "name": "adamw", "lr": 0.0003, "weight_decay": 0.01,
                      "beta1": 0.9, "beta2": 0.95, "eps": 1e-8, "grad_clip": 1.0,
                  },
                  "scheduler": {"name": "constant", "warmup_steps": 0, "min_lr_ratio": 1.0},
                  "checkpoint": {
                      "save_dir": "artifacts/runs/t_dev_6l_first_run/checkpoints",
                      "save_every_n_steps": 10,
                      "keep_last_n": 2,
                  },
                  "distributed": {"backend": "auto", "fsdp_enabled": False},
              },
          })
          train(cfg)
          print("Training complete.")
          PYEOF

      - name: Run benchmark scorer
        run: |
          python -m supreme_modeltx.model_core.eval.benchmark \
            --eval-set configs/benchmark_eval_set.json \
            --baselines configs/benchmark_baselines.json \
            --samples-root artifacts/runs/t_dev_6l_first_run/run_artifacts \
            --output-dir artifacts/runs/t_dev_6l_first_run/benchmark_outputs

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: first-experiment-run-artifacts
          path: artifacts/runs/t_dev_6l_first_run/run_artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: first-experiment-benchmark-outputs
          path: artifacts/runs/t_dev_6l_first_run/benchmark_outputs
          if-no-files-found: error
          retention-days: 90

      - name: Print benchmark summary
        run: cat artifacts/runs/t_dev_6l_first_run/benchmark_outputs/benchmark_results.md

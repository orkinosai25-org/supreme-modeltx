name: Python CI — Smoke & Unit Tests

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Install torch (CPU-only for CI)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax check (compileall)
        run: python -m compileall src/supreme_modeltx

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run smoke tests (CPU — includes 2-step training dry run)
        # The smoke tests include TestTrainingDryRun which runs the trainer
        # for 2 steps on a tiny CPU model — no GPU required.
        run: python -m pytest tests/smoke/ -v --tb=short

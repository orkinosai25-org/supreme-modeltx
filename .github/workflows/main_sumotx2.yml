# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - sumotx2

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/main_sumotx2.yml'
      - 'deployment/azure/**'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API and test dependencies
        run: |
          python -m pip install -r deployment/azure/requirements.txt
          python -m pip install "pytest>=8.3,<9.0"

      - name: Test API and Azure deployment configuration
        run: python -m pytest tests/unit/test_api_startup.py tests/unit/test_platform_api.py tests/unit/test_azure_deployment.py

      - name: Prepare API-only deployment package
        run: |
          mkdir -p "${{ runner.temp }}/azure-app"
          cp pyproject.toml README.md LICENSE "${{ runner.temp }}/azure-app/"
          git archive HEAD src | tar -x -C "${{ runner.temp }}/azure-app"
          cp deployment/azure/requirements.txt "${{ runner.temp }}/azure-app/requirements.txt"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ runner.temp }}/azure-app
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: azure-sumotx2
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: azure-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_920A62D6553F46918CB53A08B9D7BD48 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_281DB49B20204AF29C04E1E34B4BEB76 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7A89E4299154C62AF0BCB762239E0F7 }}

      - name: Validate production authentication settings
        run: |
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP repository variable}"
          az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name sumotx2 \
            --query "[?name=='SUPREME_MODELTX_API_KEY' || name=='SMTX_API_KEY' || name=='SUPREME_MODELTX_KEY_SALT' || name=='SMTX_KEY_SALT']" \
            --output json | python -c '
          import json, sys
          settings = {item["name"]: item["value"] for item in json.load(sys.stdin)}
          for name, default in (("API_KEY", "dev-secret"), ("KEY_SALT", "supreme-modeltx-default-dev-salt-2026")):
              value = settings.get("SUPREME_MODELTX_" + name, settings.get("SMTX_" + name, ""))
              if not value or value == default:
                  sys.exit("Configure a non-development " + name + " in Azure App Service before deploying.")
          '

      - name: Configure Python runtime and persistent MVP storage
        run: |
          az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name sumotx2 \
            --linux-fx-version 'PYTHON|3.11' \
            --startup-file 'python -m uvicorn supreme_modeltx.platform_api.api.app:create_app --factory --host 0.0.0.0 --port 8000' \
            --generic-configurations '{"healthCheckPath": "/health/"}' --output none
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name sumotx2 \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            SUPREME_MODELTX_PLATFORM_DB_PATH=/home/smtx/platform.sqlite3 \
            --output none

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'sumotx2'
          slot-name: 'Production'
          package: azure-app

      - name: Verify deployed API health
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 --connect-timeout 10 --max-time 30 \
            "${APP_URL%/}/health/"
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - sumotx2

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare API-only deployment package
        run: |
          rm -rf deployment/azure/package
          mkdir -p deployment/azure/package
          cp pyproject.toml README.md LICENSE deployment/azure/package/
          cp deployment/azure/requirements.txt deployment/azure/package/requirements.txt
          cp -R src deployment/azure/package/src

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment/azure/package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9456F36C427F413AA5E282D767934912 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_674EC05D35D24CBB9391A8891DC1D1B2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09F9588BC20E43D88ABB4055C059AA49 }}

      - name: Validate production authentication settings
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [[ -z "$AZURE_RESOURCE_GROUP" ]]; then echo "::error::Set the AZURE_RESOURCE_GROUP repository variable."; exit 1; fi
          az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sumotx2" \
            --query "[?name=='SMTX_API_KEY' || name=='SUPREME_MODELTX_API_KEY' || name=='SMTX_KEY_SALT' || name=='SUPREME_MODELTX_KEY_SALT']" \
            --output json |
          python -c 'import json,sys; settings={item["name"]:item.get("value","") for item in json.load(sys.stdin)}; key=settings.get("SUPREME_MODELTX_API_KEY",settings.get("SMTX_API_KEY","")); salt=settings.get("SUPREME_MODELTX_KEY_SALT",settings.get("SMTX_KEY_SALT","")); valid=bool(key and salt and key != salt and key!="dev-secret" and salt!="supreme-modeltx-default-dev-salt-2026"); sys.stderr.write("Configure a non-development API key and key salt in Azure app settings.\n") if not valid else None; sys.exit(0 if valid else 1)'

      - name: Configure Python runtime and persistent MVP storage
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sumotx2" \
            --linux-fx-version "PYTHON|3.11" \
            --startup-file "python -m uvicorn supreme_modeltx.platform_api.api.app:create_app --factory --host 0.0.0.0 --port 8000"
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sumotx2" \
            --generic-configurations '{"healthCheckPath":"/health/"}'
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sumotx2" \
            --settings "SCM_DO_BUILD_DURING_DEPLOYMENT=true" "SUPREME_MODELTX_PLATFORM_DB_PATH=/home/smtx/platform.sqlite3"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'sumotx2'
          slot-name: 'Production'

      - name: Verify deployed API liveness
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          hostname=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sumotx2" \
            --query defaultHostName \
            --output tsv)
          curl --fail --retry 10 --retry-delay 6 --retry-connrefused \
            "https://$hostname/health/"

name: First GPU Benchmarked Experiment (T-dev-6L)

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Number of training steps"
        required: false
        default: "1000"
      seed:
        description: "Random seed"
        required: false
        default: "42"

permissions:
  contents: read

jobs:
  train-benchmark-compare:
    name: Candidate single-GPU experiment (not yet GPU validated)
    runs-on: [self-hosted, linux, x64, gpu]
    env:
      SMTX_REQUIRE_GPU: "1"
      MAX_STEPS: ${{ inputs.max_steps || '1000' }}
      TRAINING_SEED: ${{ inputs.seed || '42' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install candidate CUDA environment
        run: |
          python -m pip install "torch>=2.4,<2.6" --index-url https://download.pytorch.org/whl/cu124
          python -m pip install -e ".[foundation,dev]"

      - name: Verify CUDA with synchronized numerical checks
        run: |
          nvidia-smi
          mkdir -p artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts
          python -m pip freeze > artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts/environment.txt
          python -m supreme_modeltx.foundation.gpu_diagnostics --require-cuda \
            > artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts/gpu_diagnostics.json

      - name: Require immutable approved tokenizer and clean checkpoint state
        run: |
          test -f artifacts/tokenizers/t-dev-6l/t-dev-6l/v1/tokenizer.model || {
            echo "Restore the approved tokenizer from private storage; do not retrain at the same path."
            exit 1
          }
          if find artifacts/runs/t_dev_6l_first_gpu_run/checkpoints -name 'checkpoint_step_*.pt' -print -quit 2>/dev/null | grep -q .; then
            echo "Archive prior run outputs before a fresh experiment; implicit resume is not comparable."
            exit 1
          fi

      - name: Prepare exact config and run preflight
        run: |
          python - <<'PYEOF'
          import json
          import os
          from pathlib import Path
          cfg = json.loads(Path("configs/real_training/t_dev_6l_first_gpu_run.json").read_text())
          cfg["training"]["max_steps"] = int(os.environ["MAX_STEPS"])
          cfg["training"]["seed"] = int(os.environ["TRAINING_SEED"])
          target = Path("artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts/launch_config.json")
          target.write_text(json.dumps(cfg, indent=2))
          PYEOF
          python -m supreme_modeltx.model_core.training.trainer \
            --config artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts/launch_config.json --preflight

      - name: Run first GPU benchmarked experiment
        run: |
          python -m supreme_modeltx.model_core.training.trainer \
            --config artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts/launch_config.json

      - name: Run benchmark scorer
        run: |
          python -m supreme_modeltx.model_core.eval.benchmark \
            --eval-set configs/benchmark_eval_set.json \
            --baselines configs/benchmark_baselines.json \
            --samples-root artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts \
            --output-dir artifacts/runs/t_dev_6l_first_gpu_run/benchmark_outputs

      - name: Compare only identical artifacts and experiment settings
        run: |
          python - <<'PYEOF'
          import json
          import math
          from pathlib import Path
          from supreme_modeltx.model_core.training.trainer import compare_gpu_run

          run_root = Path("artifacts/runs")
          gpu_run = "t_dev_6l_first_gpu_run"
          cpu_runs = ["t_dev_6l_first_run", "t_dev_6l_expanded_run"]

          def load(run, relative):
              path = run_root / run / relative
              return json.loads(path.read_text()) if path.exists() else {}

          gpu_summary = load(gpu_run, "run_artifacts/training_summary.json")
          gpu_bench = load(gpu_run, "benchmark_outputs/benchmark_results.json")
          comparisons = []
          for run in cpu_runs:
              comparison = compare_gpu_run(
                  gpu_summary, load(run, "run_artifacts/training_summary.json"),
                  gpu_bench, load(run, "benchmark_outputs/benchmark_results.json"),
              )
              comparison["run_name"] = run
              comparisons.append(comparison)

          output_dir = run_root / gpu_run / "comparison_vs_cpu"
          output_dir.mkdir(parents=True, exist_ok=True)
          payload = {
              "gpu_run_name": gpu_run,
              "gpu_device": gpu_summary.get("device"),
              "gpu_precision": gpu_summary.get("precision"),
              "gpu_artifact_identity": gpu_summary.get("artifact_identity"),
              "gpu_best_checkpoint": comparisons[0]["gpu_best_checkpoint"],
              "gpu_best_benchmark": comparisons[0]["gpu_best_benchmark"],
              "comparisons": comparisons,
          }

          def sanitize(value):
              if isinstance(value, float) and not math.isfinite(value):
                  return None
              if isinstance(value, dict):
                  return {key: sanitize(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [sanitize(item) for item in value]
              return value

          (output_dir / "comparison_vs_cpu.json").write_text(
              json.dumps(sanitize(payload), indent=2, allow_nan=False)
          )
          lines = [
              "# GPU Run Comparison vs CPU Runs", "",
              "Hardware deltas require identical content hashes, code revision, precision, and settings.",
              "Historical runs without hashes are noncomparable. Missing metrics are N/A, never zero.", "",
              "| CPU run | Comparable | Δ val loss | Δ perplexity | Δ overall | Δ code | Δ reasoning |",
              "|---|---|---:|---:|---:|---:|---:|",
          ]
          for item in comparisons:
              values = ["N/A" if value is None else f"{value:.4f}" for value in item["gpu_vs_cpu"].values()]
              lines.append(f"| {item['run_name']} | {item['comparable']} | " + " | ".join(values) + " |")
              if item["noncomparable_reasons"]:
                  lines.append("\nNoncomparable " + item["run_name"] + ": " + "; ".join(item["noncomparable_reasons"]) + "\n")
          (output_dir / "comparison_vs_cpu.md").write_text("\n".join(lines) + "\n")
          PYEOF

      - name: Upload GPU run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-gpu-experiment-run-artifacts
          path: artifacts/runs/t_dev_6l_first_gpu_run/run_artifacts
          if-no-files-found: warn
          retention-days: 90

      - name: Upload GPU benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: first-gpu-experiment-benchmark-outputs
          path: artifacts/runs/t_dev_6l_first_gpu_run/benchmark_outputs
          if-no-files-found: error
          retention-days: 90

      - name: Upload GPU vs CPU comparison outputs
        uses: actions/upload-artifact@v4
        with:
          name: first-gpu-experiment-vs-cpu-comparison
          path: artifacts/runs/t_dev_6l_first_gpu_run/comparison_vs_cpu
          if-no-files-found: error
          retention-days: 90

      - name: Publish comparison summary
        run: |
          cat artifacts/runs/t_dev_6l_first_gpu_run/comparison_vs_cpu/comparison_vs_cpu.md \
            >> "$GITHUB_STEP_SUMMARY"

name: Expanded Benchmarked Experiment (T-dev-6L)

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Number of training steps"
        required: false
        default: "200"
      seed:
        description: "Random seed"
        required: false
        default: "42"

permissions:
  contents: read

jobs:
  train-and-benchmark:
    name: Train expanded T-dev-6L and score checkpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Prepare expanded training data and tokenizer
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path
          from supreme_modeltx.model_core.tokenizer.workflow import train_versioned_sentencepiece

          run_root = Path("artifacts/runs/t_dev_6l_expanded_run")
          data_dir = run_root / "data"
          data_dir.mkdir(parents=True, exist_ok=True)

          code_templates = [
              "Write a Python function {name}(values) that returns {goal}.",
              "Given list values={values}, produce Python code that returns {goal}.",
              "In Python, implement {name} and include at least one unit test assertion.",
          ]
          reasoning_templates = [
              "If five machines make five widgets in five minutes, how many widgets do {d} machines make in five minutes?",
              "All birds have wings. A sparrow is a bird. Does a sparrow have wings? Answer yes or no.",
              "Summarise in one sentence why gradient clipping helps stability in transformer training.",
          ]
          ops = [
              ("max_of_two", "the larger integer"),
              ("safe_divide", "0 when denominator is 0"),
              ("dedupe_sorted", "a sorted list without duplicates"),
              ("token_count", "the number of whitespace-delimited tokens"),
          ]

          train_file = data_dir / "train.jsonl"
          val_file = data_dir / "val.jsonl"
          with train_file.open("w", encoding="utf-8") as f:
              for i in range(120):
                  name, goal = ops[i % len(ops)]
                  f.write(json.dumps({"text": code_templates[i % len(code_templates)].format(name=name, values=[i % 5, (i + 1) % 7, (i + 2) % 9], goal=goal)}) + "\n")
                  f.write(json.dumps({"text": reasoning_templates[i % len(reasoning_templates)].format(d=(i % 20 + 1) * 5)}) + "\n")
          with val_file.open("w", encoding="utf-8") as f:
              for i in range(24):
                  f.write(json.dumps({"text": f"Validation sample {i}: Python list comprehension [x*x for x in range(4)] equals [0, 1, 4, 9]."}) + "\n")
                  f.write(json.dumps({"text": f"Validation sample {i}: If five machines make five widgets in five minutes, 100 machines make 100 widgets."}) + "\n")

          manifest_path = run_root / "manifest.yaml"
          manifest_path.write_text(
              f'version: "1"\ndescription: t-dev-6l expanded benchmark run\nsources:\n'
              f'  - name: train-corpus\n    backend: jsonl\n    path: {train_file.as_posix()}\n    split: train\n'
              f'  - name: val-corpus\n    backend: jsonl\n    path: {val_file.as_posix()}\n    split: validation\n',
              encoding="utf-8",
          )

          train_versioned_sentencepiece(
              manifest_path=str(manifest_path),
              artifact_root=Path("artifacts/tokenizers/t-dev-6l"),
              model_variant="t-dev-6l",
              version="v-expanded-run",
              vocab_size=1024,
              character_coverage=1.0,
          )
          print("Expanded data and tokenizer ready.")
          PYEOF

      - name: Run expanded training experiment
        run: |
          python - <<'PYEOF'
          from supreme_modeltx.model_core.config.schema import SMTXConfig
          from supreme_modeltx.model_core.training.trainer import train

          tokenizer_path = "artifacts/tokenizers/t-dev-6l/t-dev-6l/v-expanded-run/tokenizer.model"
          manifest_path = "artifacts/runs/t_dev_6l_expanded_run/manifest.yaml"

          cfg = SMTXConfig.model_validate({
              "model": {
                  "model_variant": "t-dev-6l",
                  "vocab_size": 1024,
                  "hidden_size": 256,
                  "num_hidden_layers": 6,
                  "num_attention_heads": 8,
                  "num_key_value_heads": 8,
                  "intermediate_size": 1024,
                  "max_position_embeddings": 128,
                  "torch_dtype": "float32",
                  "pad_token_id": 0,
                  "bos_token_id": 1,
                  "eos_token_id": 2,
              },
              "tokenizer": {"backend": "sentencepiece", "model_path": tokenizer_path},
              "data": {
                  "manifest_path": manifest_path,
                  "tokenizer_path": tokenizer_path,
                  "train_split": "train",
                  "validation_split": "validation",
                  "max_seq_len": 128,
                  "pack_sequences": True,
              },
              "training": {
                  "seed": ${{ github.event.inputs.seed || 42 }},
                  "max_steps": ${{ github.event.inputs.max_steps || 200 }},
                  "batch_size": 2,
                  "gradient_accumulation_steps": 1,
                  "log_every_n_steps": 10,
                  "eval_every_n_steps": 50,
                  "eval_max_batches": 8,
                  "precision": {"enabled": False, "dtype": "float32"},
                  "optimizer": {
                      "name": "adamw", "lr": 0.0003, "weight_decay": 0.01,
                      "beta1": 0.9, "beta2": 0.95, "eps": 1e-8, "grad_clip": 1.0,
                  },
                  "scheduler": {"name": "constant", "warmup_steps": 0, "min_lr_ratio": 1.0},
                  "checkpoint": {
                      "save_dir": "artifacts/runs/t_dev_6l_expanded_run/checkpoints",
                      "save_every_n_steps": 50,
                      "keep_last_n": 4,
                  },
                  "distributed": {"backend": "auto", "fsdp_enabled": False},
              },
          })
          train(cfg)
          print("Expanded training complete.")
          PYEOF

      - name: Run benchmark scorer
        run: |
          python -m supreme_modeltx.model_core.eval.benchmark \
            --eval-set configs/benchmark_eval_set.json \
            --baselines configs/benchmark_baselines.json \
            --samples-root artifacts/runs/t_dev_6l_expanded_run/run_artifacts \
            --output-dir artifacts/runs/t_dev_6l_expanded_run/benchmark_outputs

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: expanded-experiment-run-artifacts
          path: artifacts/runs/t_dev_6l_expanded_run/run_artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: expanded-experiment-benchmark-outputs
          path: artifacts/runs/t_dev_6l_expanded_run/benchmark_outputs
          if-no-files-found: error
          retention-days: 90

      - name: Print benchmark summary
        run: cat artifacts/runs/t_dev_6l_expanded_run/benchmark_outputs/benchmark_results.md

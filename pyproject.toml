[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supreme-modeltx"
version = "0.1.0"
description = "Supreme ModelTX — British sovereign LLM platform: PyTorch-first model core and API-first business platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["llm", "transformer", "sovereign-ai", "pytorch", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3.0",
    "sentencepiece>=0.2.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]
eval = [
    "torch>=2.3.0",
    "datasets>=2.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
]

[project.scripts]
smtx-train = "supreme_modeltx.model_core.training.trainer:main"
smtx-serve = "supreme_modeltx.platform_api.api.app:main"
smtx-tokenizer-train = "supreme_modeltx.model_core.tokenizer.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

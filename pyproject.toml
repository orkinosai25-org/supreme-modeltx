[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supreme-modeltx"
version = "0.1.0"
description = "Private PyTorch development foundation for Supreme Model T-X."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["llm", "transformer", "sovereign-ai", "pytorch", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2,<7.0",
]

[project.optional-dependencies]
foundation = [
    "torch>=2.4,<2.6",
    "transformers>=4.44,<4.48",
    "datasets>=2.21,<3.0",
    "tokenizers>=0.20,<0.21",
    "safetensors>=0.4.5,<0.6",
    "evaluate>=0.4.3,<0.5",
    "sentencepiece>=0.2,<0.3",
]
train = [
    "torch>=2.4,<2.6",
    "transformers>=4.44,<4.48",
    "datasets>=2.21,<3.0",
    "tokenizers>=0.20,<0.21",
    "safetensors>=0.4.5,<0.6",
    "evaluate>=0.4.3,<0.5",
    "sentencepiece>=0.2,<0.3",
    "accelerate>=0.34,<0.35",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]
eval = [
    "torch>=2.4,<2.6",
    "datasets>=2.21,<3.0",
    "evaluate>=0.4.3,<0.5",
]
dev = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5,<7",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
smtx-train = "supreme_modeltx.model_core.training.trainer:main"
smtx-serve = "supreme_modeltx.platform_api.api.app:main"
smtx-tokenizer-train = "supreme_modeltx.model_core.tokenizer.train:main"
smtx-foundation-train = "supreme_modeltx.foundation.training:main"
smtx-foundation-eval = "supreme_modeltx.foundation.evaluation:main"
smtx-dataset = "supreme_modeltx.foundation.dataset_tools:main"
smtx-gpu-diagnostics = "supreme_modeltx.foundation.gpu_diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

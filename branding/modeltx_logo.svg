<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="chrome" cx="50%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#C0C0C0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#404040" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1A3AFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A3AFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- Main chrome circle -->
  <circle cx="100" cy="100" r="85" fill="url(#chrome)" stroke="#888" stroke-width="2"/>

  <!-- T letter -->
  <rect x="60" y="58" width="80" height="14" rx="4" fill="#0A0A0A"/>
  <rect x="93" y="58" width="14" height="72" rx="4" fill="#0A0A0A"/>

  <!-- X letter -->
  <text x="100" y="172" font-family="Inter, Arial, sans-serif" font-size="13"
        font-weight="bold" fill="#0A0A0A" text-anchor="middle" letter-spacing="3">
    SMTX
  </text>
</svg>
